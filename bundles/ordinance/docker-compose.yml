# =============================================================
# Ordinance — deployment (evaluation by default)
# =============================================================
# Pulls a prebuilt image from GitHub Container Registry. The reference policy
# bundle, the web console, the enforcement client and the proof battery are
# baked into the image — nothing to build.
#
# You need:
#   1. Docker Desktop (running) — Mac or Windows — or Docker Engine / Podman
#   2. A .env file next to this one (copy .env.example) with two lines set:
#        ORDINANCE_ACCEPT_TERMS=1
#        ORDINANCE_API_KEY=<a key you generate>
#
# Then:      docker compose up -d
# Console:   http://localhost:8088/     (setup code: docker compose logs ordinance)
# Health:    curl http://localhost:8088/health
#
# INSTALL.md walks through a first run. PRODUCTION.md covers TLS, keys,
# operators, policy changes, backup and upgrades. INTEGRATION.md covers calling
# Ordinance from your systems and agents.
# =============================================================

name: ordinance

services:
  ordinance:
    # Pinned by DIGEST, not by tag. Tags are mutable — a tag can be repointed at a
    # different image, so a tag cannot tell you months later what you actually ran.
    # This digest is Ordinance 4.0.0 and can never mean anything else.
    #
    # SIGNED (cosign, keyless via GitHub Actions OIDC). Verify before you run it:
    #   cosign verify ghcr.io/chrismagill/ordinance@sha256:3b44248e... \
    #     --certificate-identity-regexp '^https://github.com/chrismagill/ordinance/' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
    #
    # UPGRADING: because of the pin, `docker compose pull` alone never changes
    # what runs. To move to a new release, replace this line with the digest from
    # the new bundle (or download the new bundle), then `docker compose up -d`.
    image: ghcr.io/chrismagill/ordinance@sha256:3b44248ecde0feaa38411af6d313a3135f3d9fea13ae15041cffaf7463d98bfd
    container_name: phaethon-ordinance
    restart: unless-stopped
    ports:
      # Published on THIS MACHINE ONLY by default. The container speaks plain
      # HTTP, so API keys, console passwords and session tokens would cross the
      # network unencrypted if it were exposed directly. For other machines to
      # reach it, put a TLS reverse proxy in front (PRODUCTION.md, "TLS") rather
      # than changing ORDINANCE_BIND to 0.0.0.0.
      - "${ORDINANCE_BIND:-127.0.0.1}:${ORDINANCE_HOST_PORT:-8088}:8080"
    environment:
      # Terms of Use acknowledgment — REQUIRED, fail-closed. Ordinance will not
      # start without it. Review the terms at legal/terms_of_use.md in the image
      # (also served at GET /terms once running), then set this to 1 in .env.
      # This is a deliberate acknowledgment by you, the operator — we do not
      # pre-accept it on your behalf. The accepted version is recorded in the
      # boot log.
      ORDINANCE_ACCEPT_TERMS: ${ORDINANCE_ACCEPT_TERMS:?you must accept the Ordinance Terms of Use — review GET /terms or legal/terms_of_use.md, then set ORDINANCE_ACCEPT_TERMS=1 in .env}
      # Keyless evaluation: self-issues a short-lived license at startup so the
      # trial runs with no license to obtain. For production, set ORDINANCE_EVAL=
      # (empty) and LICENSE_KEY in .env.
      ORDINANCE_EVAL: ${ORDINANCE_EVAL-1}
      LICENSE_KEY: ${LICENSE_KEY:-}
      ORDINANCE_LICENSE_GRACE_PERIOD_DAYS: ${ORDINANCE_LICENSE_GRACE_PERIOD_DAYS:-14}
      # The baseline API key — REQUIRED, and deliberately has no default: a
      # published default key is no key. Generate one (see .env.example).
      # Callers send it as the X-Api-Key header; it is recorded as "key:default".
      ORDINANCE_API_KEY: ${ORDINANCE_API_KEY:?set ORDINANCE_API_KEY in .env — generate one with openssl rand -hex 32}
      # One named key per calling system or agent (name=key,name2=key2), so the
      # ledger records WHICH integration asked. And which of those names may
      # resolve approvals by API — leave empty and only signed-in console
      # operators can approve.
      ORDINANCE_API_KEYS: ${ORDINANCE_API_KEYS:-}
      ORDINANCE_APPROVER_KEYS: ${ORDINANCE_APPROVER_KEYS:-}
      # First-run console setup needs a one-time code. Leave empty and Ordinance
      # generates one and prints it in its log (docker compose logs ordinance).
      ORDINANCE_SETUP_CODE: ${ORDINANCE_SETUP_CODE:-}
      ORDINANCE_DEFAULT_DECISION: ${ORDINANCE_DEFAULT_DECISION:-escalate}
      ORDINANCE_APPROVAL_TTL_SECONDS: ${ORDINANCE_APPROVAL_TTL_SECONDS:-86400}
    volumes:
      # The decision ledger, approvals and operator accounts. Back it up
      # (PRODUCTION.md, "Backup and restore"). `docker compose down -v` DELETES it.
      - ordinance-data:/data
      # To use your OWN policy bundles instead of the built-in reference set,
      # uncomment the next line and put *.yaml files in a ./policies folder
      # next to this file. Validate before every restart (PRODUCTION.md).
      # - ./policies:/srv/policies:ro
    security_opt: ["no-new-privileges:true"]

volumes:
  ordinance-data:
